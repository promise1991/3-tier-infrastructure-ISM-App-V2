# ================================================================
# PRODUCTION DEPLOYMENT — MANUAL TRIGGER ONLY
# ================================================================
# WHEN: only when YOU manually run it from GitHub Actions tab
# WHAT: deploys pre-built AMIs to production infrastructure
# WHY:  production deployments require human decision and review
#       nobody deploys to production without explicit approval
# ================================================================

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      web_ami_id:
        description: 'Web AMI ID (from Build Production AMIs workflow)'
        required: true
        type: string
      app_ami_id:
        description: 'App AMI ID (from Build Production AMIs workflow)'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  WEB_ASG_NAME: web-asg
  APP_ASG_NAME: app-asg

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation word
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "ERROR: You must type DEPLOY to confirm!"
            echo "You typed: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
          echo "Confirmation accepted!"

      - name: Validate AMI IDs
        run: |
          WEB_AMI="${{ github.event.inputs.web_ami_id }}"
          APP_AMI="${{ github.event.inputs.app_ami_id }}"

          if [[ ! "$WEB_AMI" =~ ^ami-[a-f0-9]+$ ]]; then
            echo "ERROR: Invalid Web AMI ID format: $WEB_AMI"
            exit 1
          fi

          if [[ ! "$APP_AMI" =~ ^ami-[a-f0-9]+$ ]]; then
            echo "ERROR: Invalid App AMI ID format: $APP_AMI"
            exit 1
          fi

          echo "Web AMI ID valid: $WEB_AMI"
          echo "App AMI ID valid: $APP_AMI"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout infrastructure code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Web Launch Template
        run: |
          echo "Updating Web Launch Template..."
          aws ec2 create-launch-template-version \
            --launch-template-name web-launch-template \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"${{ github.event.inputs.web_ami_id }}\"}"
          aws ec2 modify-launch-template \
            --launch-template-name web-launch-template \
            --default-version '$Latest'
          echo "Web Launch Template updated!"

      - name: Update App Launch Template
        run: |
          echo "Updating App Launch Template..."
          aws ec2 create-launch-template-version \
            --launch-template-name app-launch-template \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"${{ github.event.inputs.app_ami_id }}\"}"
          aws ec2 modify-launch-template \
            --launch-template-name app-launch-template \
            --default-version '$Latest'
          echo "App Launch Template updated!"

      - name: Refresh Web ASG
        run: |
          echo "Starting Web ASG instance refresh..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.WEB_ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'
          echo "Web ASG refresh started!"

      - name: Refresh App ASG
        run: |
          echo "Starting App ASG instance refresh..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.APP_ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'
          echo "App ASG refresh started!"

      - name: Deployment Summary
        run: |
          echo "================================================"
          echo "PRODUCTION DEPLOYMENT COMPLETE!"
          echo "================================================"
          echo "Deployed by : ${{ github.actor }}"
          echo "Web AMI     : ${{ github.event.inputs.web_ami_id }}"
          echo "App AMI     : ${{ github.event.inputs.app_ami_id }}"
          echo "Time        : $(date)"
          echo "================================================"
